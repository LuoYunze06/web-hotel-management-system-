<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guest Information</title>
    <link rel="stylesheet" href="../common.css">
</head>
<body>
<header>
    <div class="logo">Hotel Management System</div>
    <div class="nav">
         <a href="status.html">Room Status</a>
        <a href="service.html">Room Service</a>
        <a href="billing.html">Billing</a>
        <a href="room-price.html">Room Pricing</a>
        <a href="room-guest.html" class="active">Guest Information</a>
        <a href="../../interface/behind.html">Home</a>
    </div>
</header>
<div class="main">
    <div class="panel">
        <h2>Guest Registration</h2>
        <div class="form-group">
            <label>Guest Name</label>
            <input type="text" id="gname" placeholder="Required field (max 50 characters)" required>
        </div>
        <div class="form-group">
            <label>Room Number</label>
            <input type="text" id="groom" placeholder="Required field" data-no-char-limit="true" required>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" id="gphone" placeholder="Required field" data-no-char-limit="true" required>
        </div>
        <div class="form-group">
            <label>Check-in Date</label>
            <input type="date" id="gdate">
        </div>
        <button onclick="addGuest()">Add</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Room</th>
                    <th>Phone</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="guestBody"></tbody>
        </table>
    </div>
</div>
<script src="../js/room-guest.js"></script>
<script src="../../input-validation.js"></script>
</body>
</html>
