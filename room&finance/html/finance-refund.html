<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Refund Registration</title>
    <link rel="stylesheet" href="../common.css">
</head>
<body>
<header>
    <div class="logo">Hotel Management System</div>
    <div class="nav">
        <a href="finance.html">Income & Expense Entry</a>
        <a href="finance-query.html">Record Search</a>
        <a href="finance-stat.html">Financial Statistics</a>
        <a href="finance-refund.html" class="active">Refund Registration</a>
        <a href="finance-cost.html">Daily Expenses</a>
        <a href="finance-invoice.html">Invoice Management</a>
        <a href="../../interface/behind.html">Home</a>
    </div>
</header>
<div class="main">
    <div class="panel">
        <h2>Customer Refund Registration</h2>
        <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="refundName" placeholder="Required field (max 50 characters)" required>
        </div>
        <div class="form-group">
            <label>Refund Amount</label>
            <input type="number" id="refundMoney" placeholder="Required field" data-no-char-limit="true" required>
        </div>
        <div class="form-group">
            <label>Refund Reason</label>
            <input type="text" id="refundReason" placeholder="Required field (max 50 characters)" required>
        </div>
        <div class="form-group">
            <label>Registration Date</label>
            <input type="date" id="refundDate">
        </div>
        <button onclick="addRefund()">Submit Refund</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Amount</th>
                    <th>Reason</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="refundBody">
            </tbody>
        </table>
    </div>
</div>
<script src="../js/finance-refund.js"></script>
<script src="../../input-validation.js"></script>
</body>
</html>
