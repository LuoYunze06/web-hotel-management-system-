<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Pricing</title>
    <link rel="stylesheet" href="../common.css">
</head>
<body>
<header>
    <div class="logo">Hotel Management System</div>
    <div class="nav">
        <a href="status.html">Room Status</a>
        <a href="service.html">Room Service</a>
        <a href="billing.html">Billing</a>
        <a href="room-price.html" class="active">Room Pricing</a>
        <a href="room-guest.html">Guest Information</a>
        <a href="../../interface/behind.html">Home</a>
    </div>
</header>
<div class="main">
    <div class="panel">
        <h2>Room Pricing Management</h2>
        <div class="form-group">
            <label>Select Room Type</label>
            <select id="roomType" onchange="loadSelectedPrice()"></select>
        </div>
        <div class="form-group">
            <label>Nightly Price (CNY)</label>
            <input type="number" id="roomPrice" min="0" step="1">
        </div>
        <div class="form-group">
            <label>Notes</label>
            <input type="text" id="priceNote" maxlength="50" placeholder="max 50 characters">
        </div>
        <button onclick="updatePrice()">Update Room Price</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Nightly Price (CNY)</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="priceBody"></tbody>
        </table>
    </div>
</div>
<script src="../js/room-price.js"></script>
<script src="../../input-validation.js"></script>
</body>
</html>
