<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Management</title>
    <link rel="stylesheet" href="../common.css">
</head>
<body>
<header>
    <div class="logo">Hotel Management System</div>
    <div class="nav">
        <a href="finance.html">Income & Expense Entry</a>
        <a href="finance-query.html">Record Search</a>
        <a href="finance-stat.html">Financial Statistics</a>
        <a href="finance-refund.html">Refund Registration</a>
        <a href="finance-cost.html">Daily Expenses</a>
        <a href="finance-invoice.html" class="active">Invoice Management</a>
        <a href="../../interface/behind.html">Home</a>
    </div>
</header>
<div class="main">
    <div class="panel">
        <h2>Invoice Management</h2>
        <div class="form-group">
            <label>Guest Name</label>
            <input type="text" id="invName" placeholder="Required field (max 50 characters)" required>
        </div>
        <div class="form-group">
            <label>Amount</label>
            <input type="number" id="invMoney" placeholder="Required field" data-no-char-limit="true" required>
        </div>
        <div class="form-group">
            <label>Invoice Type</label>
            <select id="invType">
                <option>General Invoice</option>
                <option>Special Invoice</option>
            </select>
        </div>
        <div class="form-group">
            <label>Invoice Date</label>
            <input type="date" id="invDate">
        </div>
        <button class="btn-primary" onclick="addInvoice()">Create Invoice</button>

        <table>
            <thead>
                <tr>
                    <th>Invoice ID</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="invoiceBody">
            </tbody>
        </table>
    </div>
</div>
<script src="../js/finance-invoice.js"></script>
<script src="../../input-validation.js"></script>
</body>
</html>
