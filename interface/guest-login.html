<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Login - Nanxin Grand Hotel</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/guest-login.css">
</head>
<body data-hide-char-hint="true">
    <header class="headdecorate">
        <div class="container header-content"><div class="logo">
                <img src="校徽.webp" alt="School Emblem" class="school-logo">
                <h1>Nanxin Grand Hotel Guest Center</h1>
            </div>
            <nav class="navigator">
                <a href="before.html" class="scene">Back to Home</a>
            </nav>
        </div>
    </header>

    <div class="main-content">
        <div class="login-container">
            <div class="login-box">
                <div class="tab-switch">
                    <button class="tab-btn active" data-tab="login">Login</button>
                    <button class="tab-btn" data-tab="register">Register</button>
                </div>
                
                <form id="loginForm" class="form active">
                    <h2 class="form-title">Login</h2>
                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <input type="text" id="loginUsername" name="username" required placeholder="Required field">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" required placeholder="Required field">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                    <div id="loginMessage" class="message"></div>
                </form>
                
                <form id="registerForm" class="form">
                    <h2 class="form-title">Guest Registration</h2>
                    <div class="form-group">
                        <label for="regUsername">Username</label>
                        <input type="text" id="regUsername" name="username" required placeholder="Required field">
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Phone Number</label>
                        <input type="tel" id="regPhone" name="phone" required placeholder="Required field">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" name="password" required placeholder="Required field">
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">Confirm Password</label>
                        <input type="password" id="regConfirmPassword" name="confirmPassword" required placeholder="Required field">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Register</button>
                    <div id="registerMessage" class="message"></div>
                </form>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <div class="container">© 2024 Nanxin Grand Hotel Management System</div>
    </footer>

    <script src="js/guest-login.js"></script>
<script src="../input-validation.js"></script>
</body>
</html>
