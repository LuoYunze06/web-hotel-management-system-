<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System - Login</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body data-hide-char-hint="true">
    <div class="container">
        <div class="title">
            <h1>Hotel Management System</h1>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" name="username" placeholder="Required field" required>
            </div>
            
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" placeholder="Required field" required>
            </div>
            
            <button type="submit" class="btn">Login</button>
        </form>

        <div class="message" id="message"></div>


    </div>

    <script src="js/login.js"></script>
<script src="../input-validation.js"></script>
</body>
</html>
