<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data Management</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/users.css">
</head>
<body data-hide-char-hint="true">
    <div class="page-title">
        <h1>User Data Management</h1>
        <a href="behind.html" class="back-link">Back to Home</a>
    </div>

    <div class="register-section">
        <h2>Register New User</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="regUsername">Username</label>
                <input type="text" id="regUsername" name="username" placeholder="Required field" required>
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" name="password" placeholder="Required field" required>
            </div>
            <div class="form-group">
                <label for="regConfirmPassword">Confirm Password</label>
                <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="Required field" required>
            </div>
            <button type="submit" class="btn register-btn">Register</button>
        </form>
        <div class="message" id="message"></div>
    </div>

    <button class="btn" onclick="clearUsers()">Clear All Users</button>
    <table id="userTable">
        <thead>
            <tr>
                <th>Username</th>
                <th>Password</th>
                <th>Registration Time</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
        </tbody>
    </table>

    <script src="js/users.js"></script>
    <script src="../input-validation.js"></script>
</body>
</html>
