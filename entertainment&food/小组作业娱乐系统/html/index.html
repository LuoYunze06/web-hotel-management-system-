<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entertainment Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .nav {
            background-color: #3182ce;
            overflow: hidden;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            text-align: right;
        }

        .nav a {
            float: right;
            display: inline-block;
            color: white;
            text-align: center;
            padding: 16px 20px;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .nav a:hover {
            background-color: #2c5282;
        }

        .nav a.active {
            background-color: #2c5282;
        }

        .container {
            margin-top: 60px;
            height: calc(100vh - 60px);
        }

        #contentFrame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="nav">
      <a href="../../../interface/behind.html">Back to Home</a>
        <a href="#" onclick="loadPage('points.html', this)">Points Management</a>
        <a href="#" onclick="loadPage('pay.html', this)">Payment Management</a>
        <a href="#" onclick="loadPage('member.html', this)">Member Management</a>
        <a href="#" onclick="loadPage('item.html', this)">Item Management</a>
        <a href="#" onclick="loadPage('facility.html', this)">Facility Management</a>
        <a href="#" onclick="loadPage('evaluate.html', this)">Review Management</a>
        <a href="#" class="active" onclick="loadPage('book.html', this)">Booking Management</a>
    </div>
    <div class="container">
        <iframe id="contentFrame" src="book.html"></iframe>
    </div>

    <script>
        function loadPage(pageUrl, linkElement) {
            event.preventDefault();
            document.getElementById('contentFrame').src = pageUrl;

            const links = document.querySelectorAll('.nav a');
            links.forEach(link => link.classList.remove('active'));
            linkElement.classList.add('active');
        }
    </script>
<script src="../../../input-validation.js"></script>
</body>
</html>
